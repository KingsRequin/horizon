[workspace]
resolver = "2"
members = ["crates/horizon-core", "crates/horizon-sys", "crates/horizon-hook", "natif", "natif/ui"]

[workspace.package]
version = "0.6.6"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/KingsRequin/horizon"

[workspace.dependencies]
horizon-core = { path = "crates/horizon-core" }
horizon-sys = { path = "crates/horizon-sys" }
horizon-ui = { path = "natif/ui" }
# Capture et analyse du son, partagées avec Essaim et Prisme (dépôt à part). Pour travailler
# dessus en même temps : [patch] vers un clone voisin dans .cargo/config.toml (README).
audio-commun = { git = "https://github.com/KingsRequin/audio-commun", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
log = "0.4"
crossbeam-channel = "0.5"
windows = "0.62"
# 1.18 : la 1.19 demande Rust 1.95. Rendu logiciel seulement, plateforme maison
# (`natif/src/platform`) : ni winit, ni skia, ni femtovg.
slint = { version = "~1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

# Code généré par Slint : jamais débogué pas à pas, et ses informations de débogage pèsent
# des centaines de Mo à écrire et à lier.
[profile.dev.package.horizon-ui]
debug = false
