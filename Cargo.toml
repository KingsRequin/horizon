[workspace]
resolver = "2"
members = ["crates/horizon-core", "crates/horizon-sys", "crates/horizon-hook", "natif"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/KingsRequin/horizon"

[workspace.dependencies]
horizon-core = { path = "crates/horizon-core" }
horizon-sys = { path = "crates/horizon-sys" }
# Capture et analyse du son, partagées avec Essaim et Prisme (dépôt à part). Pour travailler
# dessus en même temps : [patch] vers un clone voisin dans .cargo/config.toml (README).
audio-commun = { git = "https://github.com/KingsRequin/audio-commun", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
log = "0.4"
crossbeam-channel = "0.5"
windows = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
