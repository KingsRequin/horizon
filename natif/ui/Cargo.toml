[package]
name = "horizon-ui"
description = "Interface Slint d'Horizon, compilée à part de horizon-natif"
# Version fixe : avec celle du workspace, chaque nouvelle version d'Horizon recompilerait tout le
# code que Slint génère.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lib]
name = "horizon_ui"
path = "lib.rs"
# Ni tests ni exemples de documentation ici : sans ces deux lignes, `cargo test` et clippy
# `--all-targets` compileraient une seconde fois tout le code généré, pour rien.
test = false
doctest = false

[features]
# Interface interprétée : Slint ne traduit plus les .slint en Rust, il les charge à l'exécution
# et les recharge quand ils changent. C'est le réglage par défaut, pour que tout ce qui compile
# en développement (cargo, rust-analyzer, `scripts/verifier.ps1`) évite le code généré, de loin
# le plus long à compiler et le plus lourd à analyser. Une version publiée embarque son
# interface : elle se compile avec `--no-default-features`, et `build.rs` refuse `live` en
# profil release.
default = ["live"]
live = ["slint/live-preview"]

[dependencies]
slint.workspace = true

[build-dependencies]
slint-build = "~1.18"
