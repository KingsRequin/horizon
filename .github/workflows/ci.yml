name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# No --locked: the committed Cargo.lock comes from a checkout where audio-commun is patched to a
# local path, so cargo resolves the git dependency here.
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust (version de rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Clippy (public edition)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (personal edition)
        run: cargo clippy --workspace --all-targets --features horizon-natif/personal -- -D warnings
      - name: Tests
        run: cargo test --workspace
